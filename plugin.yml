name: BlockDisguise
version: 1.0.0
main: dev.eventserver.blockdisguise.BlockDisguise
api-version: "1.21"
depend: [ProtocolLib]
commands:
  blockdisguise:
    description: Toggle the block disguise for non-op players
    usage: /blockdisguise <on|off|reload|status>
    aliases: [bd]
    permission: blockdisguise.admin
permissions:
  blockdisguise.admin:
    description: Use /blockdisguise
    default: op
  blockdisguise.bypass:
    description: See real blocks even when not op
    default: false
